<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krzyżówki – wgrywanie zdjęć</title>
<link rel="stylesheet" href="/static/carbon.css">
<style>
  .lista { display: grid; gap: 0; }
  .poz { display: grid; grid-template-columns: 4rem minmax(0,1fr) auto; gap: 1rem; align-items: center; padding: .75rem 0; border-bottom: 1px solid var(--cds-border-subtle-01); }
  .poz img { width: 4rem; height: 4rem; object-fit: cover; background: var(--cds-layer-accent-01); display: block; }
  .poz .nazwa { font-family: var(--cds-font-mono); font-size: .75rem; letter-spacing: .32px; word-break: break-all; }
  .odn { display: flex; flex-wrap: wrap; gap: .25rem 1rem; margin-top: .25rem; font-size: .75rem; }
  @media (max-width: 30rem) { .poz { grid-template-columns: 3rem minmax(0,1fr); } .poz .akcje { grid-column: 1 / -1; } }
</style>
</head>
<body>
<header class="cds--header">
  <div class="cds--header__name"><span>Krzyżówki</span>Wgrywanie zdjęć</div>
  <div class="cds--header__global">aparat telefonu → katalog input/</div>
</header>
<main class="cds--content">
  <div class="cds--stack">
    <section class="cds--tile">
      <h2 class="cds--type-heading-03" style="margin-bottom:1rem">Nowe zdjęcie</h2>
      <label class="cds--btn cds--btn--lg cds--file-btn">Zrób zdjęcie lub wybierz z galerii
        <input id="plik" type="file" accept="image/*" capture="environment" multiple>
      </label>
      <p id="postep" class="cds--type-helper-text-01" style="margin:.75rem 0 0;min-height:1.2em"></p>
    </section>
    <section class="cds--tile">
      <h2 class="cds--type-heading-03" style="margin-bottom:.5rem">Wgrane zdjęcia</h2>
      <div id="lista" class="lista"></div>
    </section>
  </div>
</main>
<div id="toast" class="cds--toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const postep = $('#postep');
const toast = (t, err) => { const m = $('#toast'); m.textContent = t; m.className = 'cds--toast' + (err ? ' cds--toast--error' : ''); m.style.display = 'block'; clearTimeout(m._t); m._t = setTimeout(() => m.style.display = 'none', 5000); };

async function wgraj(pliki) {
  for (const f of pliki) {
    const fd = new FormData();
    fd.append('zdjecie', f, f.name || 'zdjecie.jpg');
    postep.textContent = `Wysyłanie ${f.name || 'zdjęcia'} (${(f.size/1e6).toFixed(1)} MB)…`;
    try {
      const r = await fetch('/api/wgraj', { method: 'POST', body: fd });
      const j = await r.json();
      if (!r.ok) throw new Error(j.blad || r.statusText);
      postep.textContent = `Zapisano: ${j.zapisano.join(', ')}`; toast('Zapisano ' + j.zapisano.join(', '));
    } catch (e) {
      postep.textContent = ''; toast('Błąd: ' + e.message, true);
    }
  }
  odswiez();
}
$('#plik').addEventListener('change', e => { if (e.target.files.length) wgraj(e.target.files); e.target.value = ''; });

async function analizuj(nazwa) {
  await fetch('/api/analizuj/' + encodeURIComponent(nazwa), { method: 'POST' });
  odswiez();
  const t = setInterval(async () => {
    const s = await (await fetch('/api/stan/' + encodeURIComponent(nazwa))).json();
    if (s.stan !== 'w toku') { clearInterval(t); odswiez(); toast(s.stan === 'gotowe' ? `Analiza ${nazwa}: gotowe (${s.czas} s)` : `Analiza ${nazwa}: ${s.stan}`, s.stan !== 'gotowe'); }
  }, 1500);
}

async function odswiez() {
  const lista = await (await fetch('/api/lista')).json();
  const ul = $('#lista'); ul.innerHTML = '';
  if (!lista.length) { ul.innerHTML = '<p class="cds--type-helper-text-01">Brak zdjęć.</p>'; return; }
  for (const p of lista) {
    const stem = p.nazwa.replace(/\.[^.]+$/, '');
    const div = document.createElement('div'); div.className = 'poz';
    const stan = p.stan === 'w toku' ? '<span class="cds--tag cds--tag--teal">analiza w toku</span>' : (p.stan === 'błąd' ? '<span class="cds--tag cds--tag--red">błąd analizy</span>' : (p.wynik ? '<span class="cds--tag cds--tag--green">przeanalizowane</span>' : '<span class="cds--tag">nowe</span>'));
    const odn = p.wynik ? `<div class="odn">
        <a href="/wyniki/${stem}/naklad.jpg" target="_blank">nakładka</a>
        <a href="/wyniki/${stem}/krzywe.jpg" target="_blank">krzywe</a>
        <a href="/wyniki/${stem}/wynik.json" target="_blank">JSON</a>
        <a href="/wyniki/${stem}/zagadka.png" target="_blank">zagadka</a>
        <a href="/wyniki/${stem}/pasek.png" target="_blank">pasek</a>
        <a href="/wyniki/${stem}/${stem}.jpz" download>.jpz</a>
        <a href="/wyniki/${stem}/${stem}.ipuz" download>.ipuz</a></div>` : '';
    div.innerHTML = `<img src="/zdjecia/${encodeURIComponent(p.nazwa)}" loading="lazy" alt="">
      <div><div class="nazwa">${p.nazwa}</div><div class="cds--type-helper-text-01">${p.czas} · ${(p.rozmiar/1e6).toFixed(1)} MB · ${stan}</div>${odn}</div>
      <div class="akcje"><button class="cds--btn cds--btn--sm ${p.wynik ? 'cds--btn--tertiary' : ''}" onclick="analizuj('${p.nazwa}')">${p.wynik ? 'Analizuj ponownie' : 'Analizuj'}</button></div>`;
    ul.appendChild(div);
  }
}
odswiez();
</script>
</body>
</html>
